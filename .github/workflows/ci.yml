name: CI

on:
  push:
    branches:
      - main
      - 'aime/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist
          if-no-files-found: error

  backend:
    name: Backend build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache-dependency-path: go.sum

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist

      - name: Build backend
        run: go build ./app/server-go

  smoke-test:
    name: Smoke test
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache-dependency-path: go.sum

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist

      - name: Start server
        run: |
          go run ./app/server-go > /tmp/wealth-clock.log 2>&1 &
          echo $! > /tmp/wealth-clock.pid

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/settings > /tmp/settings.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wealth-clock.log
          exit 1

      - name: Verify API response
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/settings.json').read_text())
          assert 'data' in data, data
          print('settings api ok')
          PY

      - name: Verify SPA response
        run: |
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<!doctype html>'

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/wealth-clock.pid ]; then
            kill $(cat /tmp/wealth-clock.pid) || true
          fi
