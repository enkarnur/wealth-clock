name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: app/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package Android artifact
        working-directory: app/frontend
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/wealth-clock-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-clock-android
          path: app/frontend/release/wealth-clock-android.apk
          if-no-files-found: error

  release:
    name: Publish Android release asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: wealth-clock-android
          path: release-artifacts

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/wealth-clock-android.apk
