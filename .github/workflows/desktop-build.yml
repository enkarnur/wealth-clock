name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            artifact: wealth-clock-linux-amd64
          - name: windows
            os: windows-latest
            artifact: wealth-clock-windows-amd64
          - name: macos
            os: macos-latest
            artifact: wealth-clock-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: go.sum

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build frontend once for Wails bindings
        working-directory: app/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build desktop app
        run: wails build -clean

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C build/bin -czf release/${{ matrix.artifact }}.tar.gz wealth-clock

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/${{ matrix.artifact }}
          codesign --force --deep --sign - build/bin/wealth-clock.app
          cp -R build/bin/wealth-clock.app release/${{ matrix.artifact }}/
          cat > release/${{ matrix.artifact }}/README-macOS.txt <<'EOF'
          财富时钟 macOS 版

          如果双击提示“无法验证开发者”或“已损坏”：
          1. 先把 wealth-clock.app 拖到“应用程序”文件夹。
          2. 右键点击 wealth-clock.app，选择“打开”。
          3. 如果仍提示已损坏，请打开“终端”执行：
             xattr -dr com.apple.quarantine /Applications/wealth-clock.app
          4. 再右键打开一次。

          这是未上架、未公证的个人构建包导致的系统拦截，不是文件真的损坏。
          EOF
          ditto -c -k --sequesterRsrc --keepParent release/${{ matrix.artifact }} release/${{ matrix.artifact }}.zip

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/bin/wealth-clock.exe -DestinationPath release/${{ matrix.artifact }}.zip -Force

      - name: Upload packaged desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
          generate_release_notes: true
